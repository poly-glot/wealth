field_groups:
  page_hero:
    post_types: [page]
    title: Hero
    fields:
      subtitle:
        label: Hero subtitle
        rows: 2
        type: textarea
      last_updated:
        label: Last updated
        type: date
        width: 50
      updated_label:
        choices: { reviewed: Last reviewed, updated: Last updated }
        default: updated
        label: Date label
        type: select
        width: 50
      notice:
        label: Notice panel
        rows: 4
        type: textarea
  page_front:
    post_types: [page]
    title: Front page
    fields:
      hero_line_1:
        label: Hero line 1
        type: text
        width: 33
      hero_line_2:
        label: Hero line 2
        type: text
        width: 33
      hero_line_3:
        label: Hero line 3
        type: text
        width: 34
      hero_body:
        label: Hero sub-sentence
        rows: 2
        type: textarea
      hero_images:
        label: Hero pictures (one is shown at random)
        type: gallery
      about_heading:
        label: About us heading
        type: text
      about_body:
        label: About us body
        type: wysiwyg
      opportunities_heading:
        label: Investment opportunities heading
        type: text
      opportunities_body:
        label: Investment opportunities body
        type: wysiwyg
  page_contact:
    post_types: [page]
    title: Contact page
    fields:
      contact_intro:
        label: Intro
        rows: 3
        type: textarea
      contact_steps:
        fields:
          title: { label: Title, type: text, width: 30 }
          text: { label: Text, rows: 2, type: textarea, width: 70 }
        label: What happens next
        type: repeater
      contact_groups:
        fields:
          title: { label: Title, type: text }
          text: { label: Text, rows: 3, type: textarea }
          email: { label: Email, type: email, width: 34 }
          phone: { label: Phone (display), type: text, width: 33 }
          phone_href: { label: Phone (tel link), type: text, width: 33 }
        label: Who to contact
        type: repeater
      form_intro:
        label: Form intro
        rows: 2
        type: textarea
      form_note:
        label: Form note
        rows: 2
        type: textarea
      thank_you:
        label: Thank-you message
        type: wysiwyg
